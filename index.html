<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>askROI Wallet — CDS Redesign Preview</title>

  <!-- Archivo Font -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  <!-- Material Symbols Rounded — weight 300 -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 32px 16px;
      font-family: 'Archivo', sans-serif;
    }
    ::-webkit-scrollbar { width: 0; }
    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded';
      font-weight: normal;
      font-style: normal;
      font-size: 22px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      user-select: none;
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

// ── Design tokens ────────────────────────────────────────────────────────────
const GREEN  = "#00d97e";
const CARD   = "#181818";
const BORDER = "#1e1e1e";
const MUTED  = "#B4B4B4";
const BG     = "#000000";

// ── Data ─────────────────────────────────────────────────────────────────────
const HOLDINGS = [
  { id:"u1", ticker:"USDC", name:"USDC",           value:"$1.50", amount:"1.50 USDC",  change:"+0.09%", pos:true,  bg:"#1a3560", dot:"#2775CA", initials:"US" },
  { id:"u2", ticker:"USDC", name:"USD Coin",        value:"$1.50", amount:"1.50 USDC",  change:"+0.09%", pos:true,  bg:"#1a2a4a", dot:"#627EEA", initials:"US" },
  { id:"u3", ticker:"USDC", name:"USD Coin (PoS)",  value:"$1.02", amount:"1.02 USDC",  change:"+0.09%", pos:true,  bg:"#2a1a4a", dot:"#9945FF", initials:"US" },
  { id:"e1", ticker:"ETH",  name:"Ethereum",        value:"$0.45", amount:"0.0002 ETH", change:"+3.81%", pos:true,  bg:"#1a2a4a", dot:"#627EEA", initials:"ET" },
];

const ACTIVITY = [
  { id:1, type:"Sent",     asset:"USDC", amount:"-1.00 USDC",  value:"$1.00", meta:"0x3f2...9a1b · Today, 1:48 PM",  pos:false },
  { id:2, type:"Received", asset:"ETH",  amount:"+0.0002 ETH", value:"$0.45", meta:"From Coinbase · Today, 9:11 AM", pos:true  },
  { id:3, type:"Received", asset:"USDC", amount:"+3.00 USDC",  value:"$3.00", meta:"From Faucet · Yesterday",        pos:true  },
];

const NAV_ITEMS = [
  { id:"home",   label:"Home",          icon:"home"                    },
  { id:"askai",  label:"askROI",        icon:"chat_bubble"             },
  { id:"notif",  label:"Notifications", icon:"notifications"           },
  { id:"wallet", label:"Wallet",        icon:"account_balance_wallet"  },
];

const ACTIONS = [
  { id:"send",    label:"Send",    icon:"north_east"  },
  { id:"receive", label:"Receive", icon:"south_west"  },
  { id:"convert", label:"Convert", icon:"swap_vert"   },
  { id:"buy",     label:"Buy",     icon:"paid"        },
  { id:"more",    label:"More",    icon:"more_horiz"  },
];

// ── Icon helper ───────────────────────────────────────────────────────────────
function Icon({ name, size = 22, color = "inherit", fill = 0 }) {
  return (
    <span
      className="material-symbols-rounded"
      style={{
        fontSize: size,
        color,
        fontVariationSettings: `'FILL' ${fill}, 'wght' 300, 'GRAD' 0, 'opsz' 24`,
      }}
    >{name}</span>
  );
}

// ── Divider ───────────────────────────────────────────────────────────────────
function Divider() {
  return <div style={{ height: 1, background: BORDER, margin: "0 16px" }} />;
}

// ── Token row ─────────────────────────────────────────────────────────────────
function TokenRow({ t, last }) {
  const [hover, setHover] = useState(false);
  return (
    <>
      <div
        onMouseEnter={() => setHover(true)}
        onMouseLeave={() => setHover(false)}
        style={{
          display:"flex", alignItems:"center", justifyContent:"space-between",
          padding:"14px 16px",
          background: hover ? "#161616" : "transparent",
          cursor:"pointer", transition:"background 0.15s",
          fontFamily:"'Archivo', sans-serif",
        }}
      >
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          {/* Token icon + network badge */}
          <div style={{ position:"relative", width:42, height:42, flexShrink:0 }}>
            <div style={{
              width:42, height:42, borderRadius:"50%", background:t.bg,
              display:"flex", alignItems:"center", justifyContent:"center",
              fontSize:12, fontWeight:600, color:"#fff",
              border:`1.5px solid ${BORDER}`, letterSpacing:0.5,
            }}>{t.initials}</div>
            <div style={{
              position:"absolute", bottom:-2, right:-2,
              width:15, height:15, borderRadius:"50%",
              background:t.dot, border:"2px solid #111",
            }} />
          </div>
          <div>
            <div style={{ fontSize:16, fontWeight:700, color:"#fff", letterSpacing:-0.3 }}>{t.ticker}</div>
            <div style={{ fontSize:13, color:MUTED, marginTop:3, fontWeight:400 }}>{t.amount}</div>
          </div>
        </div>
        <div style={{ textAlign:"right" }}>
          <div style={{ fontSize:16, fontWeight:700, color:"#fff" }}>{t.value}</div>
          <div style={{ fontSize:13, color: t.pos ? GREEN : "#ff4d4d", marginTop:3, fontWeight:500 }}>{t.change} 24h</div>
        </div>
      </div>
      {!last && <Divider />}
    </>
  );
}

// ── Activity row ──────────────────────────────────────────────────────────────
function ActivityRow({ item, last }) {
  return (
    <>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"14px 16px" }}>
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          <div style={{
            width:42, height:42, borderRadius:"50%", background:"#1a1a1a",
            display:"flex", alignItems:"center", justifyContent:"center",
            border:`1px solid ${BORDER}`, flexShrink:0,
          }}>
            <Icon
              name={item.pos ? "south" : "north"}
              size={22}
              color={item.pos ? GREEN : "#ff4d4d"}
            />
          </div>
          <div>
            <div style={{ fontSize:16, fontWeight:700, color:"#fff", letterSpacing:-0.3 }}>
              {item.type} · {item.asset}
            </div>
            <div style={{ fontSize:13, color:MUTED, marginTop:2, fontWeight:400 }}>{item.meta}</div>
          </div>
        </div>
        <div style={{ textAlign:"right" }}>
          <div style={{ fontSize:16, fontWeight:700, color: item.pos ? GREEN : "#ff4d4d" }}>{item.amount}</div>
          <div style={{ fontSize:13, color:MUTED, marginTop:2 }}>{item.value}</div>
        </div>
      </div>
      {!last && <Divider />}
    </>
  );
}

// ── Main app ──────────────────────────────────────────────────────────────────
function App() {
  const [hidden,    setHidden]    = useState(false);
  const [activeNav, setActiveNav] = useState("wallet");
  const [activeAct, setActiveAct] = useState(null);

  return (
    <div style={{
      width:390, background:BG, borderRadius:50,
      overflow:"hidden", color:"#fff", position:"relative",
      boxShadow:"0 48px 120px rgba(0,0,0,0.9), 0 0 0 1px #2a2a2a",
      minHeight:844,
      fontFamily:"'Archivo', sans-serif",
    }}>

      {/* ── Status bar ── */}
      <div style={{
        display:"flex", justifyContent:"space-between", alignItems:"center",
        padding:"16px 28px 0", fontSize:13, fontWeight:500, color:"#fff",
      }}>
        <span style={{ fontWeight:600 }}>2:08</span>
        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
          <Icon name="signal_cellular_alt" size={16} color="#fff" />
          <Icon name="wifi" size={16} color="#fff" />
          <Icon name="battery_full" size={16} color="#fff" />
        </div>
      </div>

      {/* ── Header ── */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 22px 14px" }}>
        <button style={{ background:"none", border:"none", cursor:"pointer", padding:6, borderRadius:8, display:"flex", alignItems:"center" }}>
          <Icon name="settings" size={22} color="#888" />
        </button>
        <span style={{ fontSize:18, fontWeight:700, letterSpacing:-0.4 }}>Wallet</span>
        <button style={{ background:"none", border:"none", cursor:"pointer", padding:6, borderRadius:8, display:"flex", alignItems:"center" }}>
          <Icon name="person" size={22} color="#888" />
        </button>
      </div>
      <div style={{ height:1, background:BORDER }} />

      {/* ── Scrollable body ── */}
      <div style={{ overflowY:"auto", maxHeight:700, paddingBottom:90 }}>

        {/* Balance hero */}
        <div style={{ textAlign:"left", padding:"26px 22px 22px" }}>
          <div style={{ fontSize:11, color:MUTED, marginBottom:8, letterSpacing:0.4, fontWeight:400 }}>
            Total Balance
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
            <span style={{ fontSize:52, fontWeight:800, letterSpacing:-2.5, lineHeight:1 }}>
              {hidden ? "••••••" : "$4.48"}
            </span>
            <button
              onClick={() => setHidden(v => !v)}
              style={{
                background:"#1a1a1a", border:`1px solid ${BORDER}`, borderRadius:"50%",
                width:40, height:40, cursor:"pointer",
                display:"flex", alignItems:"center", justifyContent:"center",
                transition:"all 0.15s", marginTop:4,
              }}
            >
              <Icon name={hidden ? "visibility_off" : "visibility"} size={22} color="#888" />
            </button>
          </div>
          <div style={{ fontSize:15, color:GREEN, fontWeight:600, letterSpacing:-0.2 }}>
            +$0.02 (+0.46%) today
          </div>
        </div>

        {/* Quick actions */}
        <div style={{ display:"flex", justifyContent:"space-around", padding:"0 10px 30px" }}>
          {ACTIONS.map(a => (
            <div key={a.id} style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:8 }}>
              <button
                onClick={() => setActiveAct(a.id === activeAct ? null : a.id)}
                style={{
                  width:58, height:58, borderRadius:"50%",
                  background: activeAct === a.id ? "#0d2b1d" : "#181818",
                  border:`1.5px solid ${activeAct === a.id ? GREEN : BORDER}`,
                  cursor:"pointer",
                  display:"flex", alignItems:"center", justifyContent:"center",
                  transition:"all 0.18s",
                }}
              >
                <Icon
                  name={a.icon}
                  size={22}
                  color={activeAct === a.id ? GREEN : "#ccc"}
                />
              </button>
              <span style={{ fontSize:13, color:"#ffffff", fontWeight:400, letterSpacing:0.1 }}>{a.label}</span>
            </div>
          ))}
        </div>

        {/* Insight banner */}
        <div style={{ margin:"0 16px 26px", background:"#0d2b1d", border:"1px solid #1a4d33", borderRadius:18, padding:"14px 16px" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:11, color:GREEN, fontWeight:700, marginBottom:5, letterSpacing:0.8, textTransform:"uppercase" }}>
                askROI
              </div>
              <div style={{ fontSize:14, color:"#ddd", lineHeight:1.55, fontWeight:400 }}>
                You're starting with USDC and ETH. Want a quick wallet read?
              </div>
            </div>
            <div style={{ marginLeft:12, flexShrink:0 }}>
              <Icon name="chevron_right" size={22} color={GREEN} />
            </div>
          </div>
        </div>

        {/* Holdings */}
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"0 16px 12px" }}>
          <span style={{ fontSize:20, fontWeight:700, letterSpacing:-0.5 }}>Your Holdings</span>
          <span style={{ fontSize:13, color:GREEN, fontWeight:600, cursor:"pointer", letterSpacing:0.1 }}>View All</span>
        </div>
        <div style={{ margin:"0 16px 26px", background:CARD, borderRadius:22, overflow:"hidden", border:`1px solid ${BORDER}` }}>
          {HOLDINGS.map((t, i) => (
            <TokenRow key={t.id} t={t} last={i === HOLDINGS.length - 1} />
          ))}
        </div>

        {/* Activity */}
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"0 16px 12px" }}>
          <span style={{ fontSize:20, fontWeight:700, letterSpacing:-0.5 }}>Recent Activity</span>
          <span style={{ fontSize:13, color:GREEN, fontWeight:600, cursor:"pointer", letterSpacing:0.1 }}>View All</span>
        </div>
        <div style={{ margin:"0 16px 16px", background:CARD, borderRadius:22, overflow:"hidden", border:`1px solid ${BORDER}` }}>
          {ACTIVITY.map((item, i) => (
            <ActivityRow key={item.id} item={item} last={i === ACTIVITY.length - 1} />
          ))}
        </div>

      </div>

      {/* ── Bottom nav ── */}
      <div style={{
        position:"absolute", bottom:0, left:0, right:0,
        background:"rgba(0,0,0,0.95)",
        backdropFilter:"blur(12px)",
        borderTop:`1px solid ${BORDER}`,
        padding:"10px 14px 26px",
      }}>
        <div style={{
          display:"flex", justifyContent:"space-around",
          background:"#111", borderRadius:100, padding:"6px",
        }}>
          {NAV_ITEMS.map(tab => {
            const active = activeNav === tab.id;
            return (
              <button
                key={tab.id}
                onClick={() => setActiveNav(tab.id)}
                style={{
                  display:"flex", flexDirection:"row",
                  alignItems:"center", gap: active ? 6 : 0,
                  background: active ? "#181818" : "transparent",
                  border:`1px solid ${active ? BORDER : "transparent"}`,
                  borderRadius:100,
                  padding: active ? "8px 14px" : "8px 14px",
                  cursor:"pointer", transition:"all 0.2s",
                  justifyContent:"center",
                  minWidth:52,
                }}
              >
                <Icon
                  name={tab.icon}
                  size={22}
                  color={active ? "#ffffff" : MUTED}
                  fill={active ? 1 : 0}
                />
                {active && (
                  <span style={{
                    fontSize:12, color:"#ffffff", fontWeight:600,
                    whiteSpace:"nowrap", fontFamily:"'Archivo', sans-serif",
                    letterSpacing:-0.1,
                  }}>
                    {tab.label}
                  </span>
                )}
              </button>
            );
          })}
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
