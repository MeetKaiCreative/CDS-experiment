<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>askROI Wallet — CDS Redesign Preview</title>

  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0b0d;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 32px 16px;
      font-family: 'Archivo', sans-serif;
    }
    ::-webkit-scrollbar { width: 0; }
    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded';
      font-weight: normal;
      font-style: normal;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      user-select: none;
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback } = React;

// ── Design Tokens (from Suggested Tokens sheet) ───────────────────────────────
const T = {
  // Backgrounds
  bgBase:      "#000000",
  bgSurface:   "#171A1F",   // color.background.surface  — cards
  bgElevated:  "#1F2329",   // color.background.elevated — elevated cards
  bgModal:     "#2A2F36",   // color.background.modal
  bgHover:     "#353C45",   // color.charcoal.50          — hover surfaces

  // Borders
  borderSubtle:  "#2A2F36", // color.border.subtle
  borderDefault: "#3F4852", // color.border.default

  // Text
  textPrimary:   "#FFFFFF",
  textSecondary: "#B4B4B4", // color.base.gray
  textTertiary:  "#6E6E6E", // color.base.gray-dark
  textSuccess:   "#4CD964", // color.text.success
  textError:     "#FF4D4F", // color.text.error

  // Brand / Green scale
  brandPrimary: "#39B54A",  // color.brand.primary
  brandHover:   "#4CD964",  // color.brand.hover
  brandAccent:  "#7CFF8A",  // color.brand.accent
  greenMuted:   "#1F6F3E",  // color.green.30 — muted UI

  // Lime (gains charts)
  limeAccent:   "#A6E22E",
};

// ── Data ──────────────────────────────────────────────────────────────────────
const HOLDINGS = [
  { id:"u1", ticker:"USDC", name:"USDC",           value:"$1.50", amount:"1.50 USDC",  change:"+0.09%", pos:true,  bg:"#1a3560", dot:"#2775CA", initials:"US" },
  { id:"u2", ticker:"USDC", name:"USD Coin",        value:"$1.50", amount:"1.50 USDC",  change:"+0.09%", pos:true,  bg:"#1a2a4a", dot:"#627EEA", initials:"US" },
  { id:"u3", ticker:"USDC", name:"USD Coin (PoS)",  value:"$1.02", amount:"1.02 USDC",  change:"+0.09%", pos:true,  bg:"#2a1a4a", dot:"#9945FF", initials:"US" },
  { id:"e1", ticker:"ETH",  name:"Ethereum",        value:"$0.45", amount:"0.0002 ETH", change:"+3.81%", pos:true,  bg:"#1a2a4a", dot:"#627EEA", initials:"ET" },
];

const ACTIVITY = [
  { id:1, type:"Sent",     asset:"USDC", amount:"-1.00 USDC",  value:"$1.00", meta:"0x3f2...9a1b · Today, 1:48 PM",  pos:false },
  { id:2, type:"Received", asset:"ETH",  amount:"+0.0002 ETH", value:"$0.45", meta:"From Coinbase · Today, 9:11 AM", pos:true  },
  { id:3, type:"Received", asset:"USDC", amount:"+3.00 USDC",  value:"$3.00", meta:"From Faucet · Yesterday",        pos:true  },
];

const NAV_ITEMS = [
  { id:"home",   label:"Home",          icon:"home"                   },
  { id:"askai",  label:"askROI",        icon:"chat_bubble"            },
  { id:"notif",  label:"Notifications", icon:"notifications"          },
  { id:"wallet", label:"Wallet",        icon:"account_balance_wallet" },
];

const ACTIONS = [
  { id:"send",    label:"Send",    icon:"north_east" },
  { id:"receive", label:"Receive", icon:"south_west" },
  { id:"convert", label:"Convert", icon:"swap_vert"  },
  { id:"buy",     label:"Buy",     icon:"paid"       },
  { id:"more",    label:"More",    icon:"more_horiz" },
];

// ── Icon helper ───────────────────────────────────────────────────────────────
function Icon({ name, size = 22, color = "inherit", fill = 0 }) {
  return (
    <span
      className="material-symbols-rounded"
      style={{
        fontSize: size,
        color,
        fontVariationSettings: `'FILL' ${fill}, 'wght' 300, 'GRAD' 0, 'opsz' 24`,
      }}
    >{name}</span>
  );
}

// ── Pressable wrapper — handles hover + press states consistently ─────────────
function Pressable({ children, onClick, style, hoverStyle, pressStyle, disabled }) {
  const [hovered, setHovered] = useState(false);
  const [pressed, setPressed] = useState(false);

  const computed = {
    ...style,
    ...(hovered ? hoverStyle : {}),
    ...(pressed ? pressStyle : {}),
    transform: pressed ? "scale(0.92)" : "scale(1)",
    transition: "background 0.12s, transform 0.08s, opacity 0.12s",
    cursor: disabled ? "default" : "pointer",
  };

  return (
    <div
      style={computed}
      onMouseEnter={() => !disabled && setHovered(true)}
      onMouseLeave={() => { setHovered(false); setPressed(false); }}
      onMouseDown={() => !disabled && setPressed(true)}
      onMouseUp={() => setPressed(false)}
      onClick={!disabled ? onClick : undefined}
    >
      {children}
    </div>
  );
}

// ── Divider ───────────────────────────────────────────────────────────────────
function Divider() {
  return <div style={{ height:1, background:T.borderSubtle, margin:"0 16px" }} />;
}

// ── Coinbase MessagingCard — Nudge type ───────────────────────────────────────
function NudgeCard({ onDismiss }) {
  return (
    <div style={{
      margin:"0 16px 26px",
      background: T.bgSurface,
      border:`1px solid ${T.borderSubtle}`,
      borderRadius:22,
      overflow:"hidden",
      position:"relative",
      display:"flex",
      flexDirection:"row",
      alignItems:"stretch",
      minHeight:114,
    }}>
      {/* Content */}
      <div style={{
        flex:1,
        padding:"16px 0 16px 18px",
        display:"flex",
        flexDirection:"column",
        justifyContent:"space-between",
        gap:6,
      }}>
        <div>
          <div style={{ fontSize:16, fontWeight:700, color:T.textPrimary, letterSpacing:-0.3, lineHeight:1.2, marginBottom:6 }}>
            askROI
          </div>
          <div style={{ fontSize:13, fontWeight:400, color:T.textSecondary, lineHeight:1.5 }}>
            You have USDC and ETH. Want a quick wallet read?
          </div>
        </div>
        {/* CTA — nudge / tertiary style */}
        <Pressable
          onClick={() => {}}
          style={{
            display:"inline-flex", alignItems:"center", gap:4,
            alignSelf:"flex-start",
            background:"transparent",
            border:`1px solid ${T.borderDefault}`,
            borderRadius:100,
            padding:"6px 14px",
            color:T.textPrimary,
            fontSize:13,
            fontWeight:600,
            fontFamily:"'Archivo', sans-serif",
            marginTop:4,
          }}
          hoverStyle={{ background:T.bgHover }}
          pressStyle={{ background:T.bgHover }}
        >
          Get insights <Icon name="arrow_forward" size={14} color={T.textPrimary} />
        </Pressable>
      </div>


      {/* Dismiss */}
      <Pressable
        onClick={onDismiss}
        style={{
          position:"absolute", top:10, right:10,
          background:"transparent",
          border:"none",
          padding:4,
          display:"flex", alignItems:"center", justifyContent:"center",
          borderRadius:"50%",
          opacity:0.5,
          width:28, height:28,
        }}
        hoverStyle={{ background:T.bgHover, opacity:1 }}
        pressStyle={{ background:T.bgHover, opacity:1 }}
      >
        <Icon name="close" size={16} color={T.textPrimary} />
      </Pressable>
    </div>
  );
}

// ── Token row ─────────────────────────────────────────────────────────────────
function TokenRow({ t, last }) {
  const [hover, setHover] = useState(false);
  return (
    <>
      <div
        onMouseEnter={() => setHover(true)}
        onMouseLeave={() => setHover(false)}
        style={{
          display:"flex", alignItems:"center", justifyContent:"space-between",
          padding:"14px 16px",
          background: hover ? T.bgHover : "transparent",
          cursor:"pointer",
          transition:"background 0.12s",
        }}
      >
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          <div style={{ position:"relative", width:42, height:42, flexShrink:0 }}>
            <div style={{
              width:42, height:42, borderRadius:"50%", background:t.bg,
              display:"flex", alignItems:"center", justifyContent:"center",
              fontSize:12, fontWeight:600, color:"#fff",
              border:`1.5px solid ${T.borderSubtle}`, letterSpacing:0.5,
            }}>{t.initials}</div>
            <div style={{
              position:"absolute", bottom:-2, right:-2,
              width:15, height:15, borderRadius:"50%",
              background:t.dot, border:`2px solid ${T.bgSurface}`,
            }} />
          </div>
          <div>
            <div style={{ fontSize:16, fontWeight:700, color:T.textPrimary, letterSpacing:-0.3 }}>{t.ticker}</div>
            <div style={{ fontSize:13, color:T.textSecondary, marginTop:3, fontWeight:400 }}>{t.amount}</div>
          </div>
        </div>
        <div style={{ textAlign:"right" }}>
          <div style={{ fontSize:16, fontWeight:700, color:T.textPrimary }}>{t.value}</div>
          <div style={{ fontSize:13, color: t.pos ? T.textSuccess : T.textError, marginTop:3, fontWeight:500 }}>{t.change} 24h</div>
        </div>
      </div>
      {!last && <Divider />}
    </>
  );
}

// ── Activity row ──────────────────────────────────────────────────────────────
function ActivityRow({ item, last }) {
  const [hover, setHover] = useState(false);
  return (
    <>
      <div
        onMouseEnter={() => setHover(true)}
        onMouseLeave={() => setHover(false)}
        style={{
          display:"flex", alignItems:"center", justifyContent:"space-between",
          padding:"14px 16px",
          background: hover ? T.bgHover : "transparent",
          cursor:"pointer",
          transition:"background 0.12s",
        }}
      >
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          <div style={{
            width:42, height:42, borderRadius:"50%", background:T.bgElevated,
            display:"flex", alignItems:"center", justifyContent:"center",
            border:`1px solid ${T.borderSubtle}`, flexShrink:0,
          }}>
            <Icon name={item.pos ? "south" : "north"} size={22} color={item.pos ? T.textSuccess : T.textError} />
          </div>
          <div>
            <div style={{ fontSize:16, fontWeight:700, color:T.textPrimary, letterSpacing:-0.3 }}>
              {item.type} · {item.asset}
            </div>
            <div style={{ fontSize:13, color:T.textSecondary, marginTop:3, fontWeight:400 }}>{item.meta}</div>
          </div>
        </div>
        <div style={{ textAlign:"right" }}>
          <div style={{ fontSize:16, fontWeight:700, color: item.pos ? T.textSuccess : T.textError }}>{item.amount}</div>
          <div style={{ fontSize:13, color:T.textSecondary, marginTop:3 }}>{item.value}</div>
        </div>
      </div>
      {!last && <Divider />}
    </>
  );
}

// ── Main app ──────────────────────────────────────────────────────────────────
function App() {
  const [hidden,    setHidden]    = useState(false);
  const [activeNav, setActiveNav] = useState("wallet");
  const [activeAct, setActiveAct] = useState(null);
  const [showNudge, setShowNudge] = useState(true);

  return (
    <div style={{
      width:390, background:T.bgBase, borderRadius:50,
      overflow:"hidden", color:T.textPrimary, position:"relative",
      boxShadow:"0 48px 120px rgba(0,0,0,0.95), 0 0 0 1px #2A2F36",
      minHeight:844,
      fontFamily:"'Archivo', sans-serif",
    }}>

      {/* ── Status bar ── */}
      <div style={{
        display:"flex", justifyContent:"space-between", alignItems:"center",
        padding:"16px 28px 0", fontSize:13, fontWeight:500,
      }}>
        <span style={{ fontWeight:600 }}>2:08</span>
        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
          <Icon name="signal_cellular_alt" size={16} color={T.textPrimary} />
          <Icon name="wifi"                size={16} color={T.textPrimary} />
          <Icon name="battery_full"        size={16} color={T.textPrimary} />
        </div>
      </div>

      {/* ── Header ── */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 22px 14px" }}>
        <Pressable
          style={{ background:"transparent", border:"none", padding:8, borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center" }}
          hoverStyle={{ background:T.bgHover }}
          pressStyle={{ background:T.bgHover }}
        >
          <Icon name="settings" size={22} color={T.textTertiary} />
        </Pressable>

        <span style={{ fontSize:18, fontWeight:700, letterSpacing:-0.4 }}>Wallet</span>

        <Pressable
          style={{ background:"transparent", border:"none", padding:8, borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center" }}
          hoverStyle={{ background:T.bgHover }}
          pressStyle={{ background:T.bgHover }}
        >
          <Icon name="person" size={22} color={T.textTertiary} />
        </Pressable>
      </div>
      <div style={{ height:1, background:T.borderSubtle }} />

      {/* ── Scrollable body ── */}
      <div style={{ overflowY:"auto", maxHeight:700, paddingBottom:90 }}>

        {/* Balance hero */}
        <div style={{ textAlign:"left", padding:"26px 22px 22px" }}>
          <div style={{ fontSize:11, color:T.textTertiary, marginBottom:8, letterSpacing:0.4, fontWeight:400 }}>
            Total Balance
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
            <span style={{ fontSize:52, fontWeight:800, letterSpacing:-2.5, lineHeight:1 }}>
              {hidden ? "••••••" : "$4.48"}
            </span>
            <Pressable
              onClick={() => setHidden(v => !v)}
              style={{
                background:T.bgSurface, border:`1px solid ${T.borderSubtle}`, borderRadius:"50%",
                width:40, height:40,
                display:"flex", alignItems:"center", justifyContent:"center",
                marginTop:4,
              }}
              hoverStyle={{ background:T.bgHover }}
              pressStyle={{ background:T.bgHover }}
            >
              <Icon name={hidden ? "visibility_off" : "visibility"} size={22} color={T.textTertiary} />
            </Pressable>
          </div>
          <div style={{ fontSize:15, color:T.brandPrimary, fontWeight:600, letterSpacing:-0.2 }}>
            +$0.02 (+0.46%) today
          </div>
        </div>

        {/* Quick actions */}
        <div style={{ display:"flex", justifyContent:"space-around", padding:"0 10px 30px" }}>
          {ACTIONS.map(a => {
            const isActive = activeAct === a.id;
            return (
              <div key={a.id} style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:8 }}>
                <Pressable
                  onClick={() => setActiveAct(isActive ? null : a.id)}
                  style={{
                    width:58, height:58, borderRadius:"50%",
                    background: isActive ? T.bgElevated : T.bgSurface,
                    border:`1.5px solid ${isActive ? T.borderDefault : T.borderSubtle}`,
                    display:"flex", alignItems:"center", justifyContent:"center",
                  }}
                  hoverStyle={{ background:T.bgHover }}
                  pressStyle={{ background:T.bgHover }}
                >
                  <Icon name={a.icon} size={22} color={isActive ? T.textPrimary : T.textSecondary} />
                </Pressable>
                <span style={{ fontSize:13, color:T.textPrimary, fontWeight:400, letterSpacing:0.1 }}>{a.label}</span>
              </div>
            );
          })}
        </div>

        {/* NudgeCard */}
        {showNudge && <NudgeCard onDismiss={() => setShowNudge(false)} />}

        {/* Holdings */}
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"0 16px 12px" }}>
          <span style={{ fontSize:20, fontWeight:700, letterSpacing:-0.5 }}>Your Holdings</span>
          <Pressable
            style={{ padding:"4px 8px", borderRadius:8, color:T.brandPrimary, fontSize:13, fontWeight:600, background:"transparent" }}
            hoverStyle={{ background:T.bgHover }}
            pressStyle={{ background:T.bgHover }}
          >View All</Pressable>
        </div>
        <div style={{ margin:"0 16px 26px", background:T.bgSurface, borderRadius:22, overflow:"hidden", border:`1px solid ${T.borderSubtle}` }}>
          {HOLDINGS.map((t, i) => (
            <TokenRow key={t.id} t={t} last={i === HOLDINGS.length - 1} />
          ))}
        </div>

        {/* Activity */}
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"0 16px 12px" }}>
          <span style={{ fontSize:20, fontWeight:700, letterSpacing:-0.5 }}>Recent Activity</span>
          <Pressable
            style={{ padding:"4px 8px", borderRadius:8, color:T.brandPrimary, fontSize:13, fontWeight:600, background:"transparent" }}
            hoverStyle={{ background:T.bgHover }}
            pressStyle={{ background:T.bgHover }}
          >View All</Pressable>
        </div>
        <div style={{ margin:"0 16px 16px", background:T.bgSurface, borderRadius:22, overflow:"hidden", border:`1px solid ${T.borderSubtle}` }}>
          {ACTIVITY.map((item, i) => (
            <ActivityRow key={item.id} item={item} last={i === ACTIVITY.length - 1} />
          ))}
        </div>

      </div>

      {/* ── Bottom nav ── */}
      <div style={{
        position:"absolute", bottom:0, left:0, right:0,
        background:"rgba(0,0,0,0.96)",
        backdropFilter:"blur(16px)",
        borderTop:`1px solid ${T.borderSubtle}`,
        padding:"10px 14px 26px",
      }}>
        <div style={{
          display:"flex", justifyContent:"space-around",
          background:T.bgSurface, borderRadius:100, padding:"6px",
        }}>
          {NAV_ITEMS.map(tab => {
            const active = activeNav === tab.id;
            return (
              <Pressable
                key={tab.id}
                onClick={() => setActiveNav(tab.id)}
                style={{
                  display:"flex", flexDirection:"row",
                  alignItems:"center", gap: active ? 6 : 0,
                  background: active ? T.bgElevated : "transparent",
                  border:`1px solid ${active ? T.borderSubtle : "transparent"}`,
                  borderRadius:100,
                  padding:"8px 14px",
                  justifyContent:"center",
                  minWidth:52,
                }}
                hoverStyle={{ background:T.bgHover }}
                pressStyle={{ background:T.bgHover }}
              >
                <Icon name={tab.icon} size={22} color={active ? T.textPrimary : T.textSecondary} fill={active ? 1 : 0} />
                {active && (
                  <span style={{
                    fontSize:12, color:T.textPrimary, fontWeight:600,
                    whiteSpace:"nowrap", fontFamily:"'Archivo', sans-serif",
                    letterSpacing:-0.1,
                  }}>
                    {tab.label}
                  </span>
                )}
              </Pressable>
            );
          })}
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
